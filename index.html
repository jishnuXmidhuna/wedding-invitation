<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Jishnu & Midhuna</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- INTRO SCREEN -->

<section id="intro-screen">

    <div class="intro-overlay"></div>

    <div class="door-wrapper">

        <div class="door left-door">
            <div class="lace-decoration left"></div>
        </div>

        <div class="door right-door">
            <div class="lace-decoration right"></div>
        </div>

        <button id="medallion-button">
            <span>Tap To Open</span>
        </button>

    </div>

</section>

<!-- MUSIC -->

<button id="music-toggle" aria-label="Toggle Music">
    ♪
</button>

<!-- MAIN CONTENT -->

<main id="invitation-content">

    <!-- HERO -->

    <section class="hero-section">

        <div class="arch-frame">

            <div class="date-badge">
                27 • 01 • 2027
            </div>

            <p class="eyebrow">
                WEDDING INVITATION
            </p>

            <h1 class="couple-names">
                Jishnu
                <span>&</span>
                Midhuna
            </h1>

            <p class="verse">
                “Therefore what God has joined together,
                let no one separate.”
            </p>

        </div>

    </section>


    <!-- DETAILS -->

    <section class="event-section">

        <h2>Ceremony</h2>

        <p>Wednesday, January 27, 2027</p>
        <p>10:30 AM</p>
        <p>Sana Hall, Kollam</p>

    </section>


    <!-- COUNTDOWN -->

    <section class="countdown-section">

        <h2>Countdown</h2>

        <div class="countdown-grid">

            <div class="count-card">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="count-card">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="count-card">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="count-card">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
